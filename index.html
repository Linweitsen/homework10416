<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素線上 API 查詢系統</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        input, button { padding: 10px; font-size: 16px; margin-top: 10px; width: 100%; box-sizing: border-box; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; display: none; }
        .error-message { color: #e91e63; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <h2>化學元素查詢 (API 版)</h2>
    <p>請輸入元素符號 (例如: H, O, FE, AU)：</p>
    
    <input type="text" id="elementInput" placeholder="輸入元素符號...">
    <button onclick="queryElement()">查詢並寫入試算表</button>

    <div id="result"></div>

    <script>
        // ★ 替換為你剛剛部署 GAS 產生的網址 ★
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwU0cTZi3y1x_Ti0r3OLDfpppx2Q2DKVIHG9S23rfSeprdeIcD0CnANYR8wC6qH7-PW/exec'; 

        async function queryElement() {
            const query = document.getElementById('elementInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!query) {
                alert("請輸入元素符號！");
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = "正在透過 API 查詢並寫入試算表...";

            try {
                // 使用 text/plain 技巧避免瀏覽器的 CORS Preflight (OPTIONS) 請求錯誤
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8', 
                    },
                    body: JSON.stringify({ query: query })
                });

                const json = await response.json();

                if (json.success) {
                    const data = json.data;
                    resultDiv.innerHTML = `
                        <h3>查詢成功</h3>
                        <p><strong>名稱：</strong> ${data.name}</p>
                        <p><strong>原子序：</strong> ${data.atomicNumber}</p>
                        <p><strong>原子量：</strong> ${data.atomicMass}</p>
                        <p><strong>常溫常壓狀態：</strong> ${data.state}</p>
                    `;
                } else {
                    // 顯示帶有 ❌ 的錯誤提示
                    resultDiv.innerHTML = `<p class="error-message">${json.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error-message">❌ 發生連線錯誤：${error}</p>`;
            }
        }
    </script>

</body>
</html>
