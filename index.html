<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純 API 元素查詢工具</title>
    <style>
        /* 最基本的清楚排版 */
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .search-box { display: flex; gap: 5px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 15px; cursor: pointer; font-size: 16px; }
        .result-card { background: #f0f0f0; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .error { color: red; }
    </style>
</head>
<body>

    <h2>🔍 元素 API 查詢器</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="輸入名稱或原子序 (留空查全部)">
        <button id="searchBtn">查詢</button>
    </div>

    <div id="resultContainer">
        <p style="color: gray;">請輸入關鍵字開始查詢...</p>
    </div>

    <script>
        // 【請在此替換你的 GAS Web App URL】
        const API_URL = 'https://script.google.com/macros/s/AKfycbwzJQfFH0XpPcrhmDP86qOd9aq9SAGkqQStJ3m2k04pbvfRTB4tWMtMQYCEWOqTQgO5/exec';

        document.getElementById('searchBtn').addEventListener('click', () => {
            const queryWord = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultContainer');
            const btn = document.getElementById('searchBtn');
            
            // 狀態變更為查詢中
            container.innerHTML = '<p>讀取 API 資料中...</p>';
            btn.disabled = true;

            // 如果有輸入字，則將其編碼並加到網址後方當作 GET 參數
            const fetchUrl = queryWord ? `${API_URL}?q=${encodeURIComponent(queryWord)}` : API_URL;

            // 發送原生 GET 請求
            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = ''; // 清空畫面
                    
                    // 錯誤處理
                    if (data.error) {
                        container.innerHTML = `<p class="error">API 錯誤：${data.error}</p>`;
                        return;
                    }

                    // 查無資料
                    if (data.length === 0) {
                        container.innerHTML = '<p>查無符合的元素。</p>';
                        return;
                    }

                    // 渲染資料
                    data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        card.innerHTML = `
                            <strong>${item.name || '未知名稱'}</strong> (原子序: ${item.atomicNumber})<br>
                            <small>原子量: ${item.atomicWeight} | 狀態: ${item.state}</small>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = '<p class="error">連線失敗，請檢查 API 網址與 Console 紀錄。</p>';
                })
                .finally(() => {
                    // 恢復按鈕狀態
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
