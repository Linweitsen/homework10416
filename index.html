<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化學元素查詢系統</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 450px; margin: auto; background-color: #f9f9f9; color: #333; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background-color: #f1f1f1; border-radius: 4px; display: none; line-height: 1.6; }
        .error { color: #d9534f; font-weight: bold; }
        .success-title { color: #28a745; margin-top: 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>化學元素查詢</h2>
        <p style="font-size: 14px; color: #666; text-align: center;">請輸入符號（例如：H, O, Fe, Au）</p>
        
        <input type="text" id="elementInput" placeholder="輸入符號...">
        <button onclick="query()">查詢</button>

        <div id="result"></div>
    </div>

    <script>
        // 🔴 🔴 🔴 請將下方的網址替換成您的 Google Apps Script 網頁應用程式網址 (結尾為 /exec) 🔴 🔴 🔴
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyaVFGFIyi67vvI3vXfJZ2zuiPFH4keAlTfoyOSqsmTr8zWByw-pDfYgbIQ3NpPs_h6/exec";

        async function query() {
            const inputVal = document.getElementById('elementInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!inputVal) {
                alert("請輸入元素符號！");
                return;
            }

            if (GAS_URL.includes("請將這段文字替換為您的_GAS_網址")) {
                alert("⚠️ 錯誤：您還沒有在程式碼中填入您的 GAS_URL 網址！\n請用記事本打開 HTML 檔案，將 GAS_URL 替換為您的真實網址。");
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = "查詢中，寫入試算表...";

            try {
                // 發送 POST 請求至您的後端 GAS
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({ query: inputVal })
                });

                const json = await response.json();

                // 顯示結果
                if (json.success) {
                    const data = json.data;
                    resultDiv.innerHTML = `
                        <h3 class="success-title">✅ 查詢成功</h3>
                        <p><strong>名稱：</strong> ${data.name}</p>
                        <p><strong>原子序：</strong> ${data.atomicNumber}</p>
                        <p><strong>原子量：</strong> ${data.atomicMass}</p>
                        <p><strong>常壓狀態：</strong> ${data.state}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">${json.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ 連線錯誤：無法連接到伺服器。<br><br>請確認您的 GAS 網址正確，且部署存取權限已設為「所有人」。</p>`;
            }
        }
    </script>
</body>
</html>
