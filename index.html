<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素查詢與自動建檔工具</title>
    <style>
        /* 極簡與現代感兼具的原生 CSS 排版 */
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 480px; margin: auto; background-color: #f3f4f6; color: #1f2937; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-top: 20px; }
        h2 { margin-top: 0; color: #111827; font-size: 1.5rem; text-align: center; }
        h3 { margin-top: 0; color: #374151; font-size: 1.1rem; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #374151; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .search-row { display: flex; gap: 8px; }
        button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
        .btn-query { background-color: #2563eb; color: white; white-space: nowrap; }
        .btn-query:hover { background-color: #1d4ed8; }
        .btn-submit { background-color: #10b981; color: white; width: 100%; margin-top: 10px; font-size: 1.05rem; }
        .btn-submit:hover { background-color: #059669; }
        .btn-search-api { background-color: #4f46e5; color: white; white-space: nowrap; }
        .btn-search-api:hover { background-color: #4338ca; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .status { margin-top: 16px; text-align: center; font-weight: bold; font-size: 0.95rem; min-height: 24px; }
        .divider { border: 0; border-top: 1px solid #e5e7eb; margin: 24px 0; }
        .result-list { background: #f9fafb; padding: 12px; border-radius: 6px; border: 1px solid #e5e7eb; max-height: 200px; overflow-y: auto; font-size: 0.9rem; }
        .result-item { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
        .result-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 元素 API 查詢建檔</h2>
    
    <!-- 搜尋區塊：輸入中文或代號自動查詢並填入 -->
    <div class="form-group">
        <label for="searchQuery">1. 輸入「元素代號」或「中文名稱」自動帶入</label>
        <div class="search-row">
            <input type="text" id="searchQuery" placeholder="例如：Fe 或 鐵" autocomplete="off">
            <button type="button" id="queryBtn" class="btn-query">線上 API 查詢</button>
        </div>
    </div>

    <hr class="divider">

    <!-- 自動填入的結果表單：確認後送出至試算表 -->
    <form id="elementForm">
        <div class="form-group">
            <label>原子序 (Atomic Number)</label>
            <input type="number" id="atomicNumber" required readonly placeholder="自動帶入..." style="background: #f9fafb; cursor: not-allowed;">
        </div>
        <div class="form-group">
            <label>元素名稱 (Name)</label>
            <input type="text" id="name" required readonly placeholder="自動帶入..." style="background: #f9fafb; cursor: not-allowed;">
        </div>
        <div class="form-group">
            <label>原子量 (Atomic Weight)</label>
            <input type="text" id="atomicWeight" required readonly placeholder="自動帶入..." style="background: #f9fafb; cursor: not-allowed;">
        </div>
        <div class="form-group">
            <label>常溫常壓狀態 (State)</label>
            <input type="text" id="state" required readonly placeholder="自動帶入..." style="background: #f9fafb; cursor: not-allowed;">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit" disabled>確認寫入 Google 試算表</button>
    </form>

    <div id="statusMessage" class="status"></div>

    <hr class="divider">

    <!-- 已建檔試算表線上查詢 (API GET) -->
    <h3>📋 試算表已存資料查詢 (GET API)</h3>
    <div class="form-group">
        <div class="search-row">
            <input type="text" id="apiSearchQuery" placeholder="輸入名稱或原子序進行搜尋 (留空則查全部)" autocomplete="off">
            <button type="button" id="apiSearchBtn" class="btn-search-api">線上查詢</button>
        </div>
    </div>
    <div id="apiResultContainer" class="result-list" style="display: none;"></div>
</div>

<script>
    // ⚠️ 請將下方的網址替換為您在 Apps Script 部署得到的 Web App URL 網址 (結尾必為 /exec)
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxOAId7fekRrPv8Z9PGsrzGAm5kEeQOQxwrqc6Qjw9O-9iA-w0gDwul877FUgk0UJ__/exec';

    // 極簡內建元素對照資料庫（用於識別輸入並作為線上 API 斷線時的本地備援）
    const elementDatabase = [
        { num: 1, sym: "H", cn: "氫", wt: 1.008, state: "氣態" },
        { num: 2, sym: "He", cn: "氦", wt: 4.0026, state: "氣態" },
        { num: 3, sym: "Li", cn: "鋰", wt: 6.94, state: "固態" },
        { num: 4, sym: "Be", cn: "鈹", wt: 9.0122, state: "固態" },
        { num: 5, sym: "B", cn: "硼", wt: 10.81, state: "固態" },
        { num: 6, sym: "C", cn: "碳", wt: 12.011, state: "固態" },
        { num: 7, sym: "N", cn: "氮", wt: 14.007, state: "氣態" },
        { num: 8, sym: "O", cn: "氧", wt: 15.999, state: "氣態" },
        { num: 9, sym: "F", cn: "氟", wt: 18.998, state: "氣態" },
        { num: 10, sym: "Ne", cn: "氖", wt: 20.180, state: "氣態" },
        { num: 11, sym: "Na", cn: "鈉", wt: 22.990, state: "固態" },
        { num: 12, sym: "Mg", cn: "鎂", wt: 24.305, state: "固態" },
        { num: 13, sym: "Al", cn: "鋁", wt: 26.982, state: "固態" },
        { num: 14, sym: "Si", cn: "矽", wt: 28.085, state: "固態" },
        { num: 15, sym: "P", cn: "磷", wt: 30.974, state: "固態" },
        { num: 16, sym: "S", cn: "硫", wt: 32.06, state: "固態" },
        { num: 17, sym: "Cl", cn: "氯", wt: 35.45, state: "氣態" },
        { num: 18, sym: "Ar", cn: "氬", wt: 39.948, state: "氣態" },
        { num: 19, sym: "K", cn: "鉀", wt: 39.098, state: "固態" },
        { num: 20, sym: "Ca", cn: "鈣", wt: 40.078, state: "固態" },
        { num: 26, sym: "Fe", cn: "鐵", wt: 55.845, state: "固態" },
        { num: 29, sym: "Cu", cn: "銅", wt: 63.546, state: "固態" },
        { num: 30, sym: "Zn", cn: "鋅", wt: 65.38, state: "固態" },
        { num: 47, sym: "Ag", cn: "銀", wt: 107.87, state: "固態" },
        { num: 53, sym: "I", cn: "碘", wt: 126.90, state: "固態" },
        { num: 79, sym: "Au", cn: "金", wt: 196.97, state: "固態" },
        { num: 80, sym: "Hg", cn: "汞", wt: 200.59, state: "液態" },
        { num: 82, sym: "Pb", cn: "鉛", wt: 207.2, state: "固態" },
        { num: 92, sym: "U", cn: "鈾", wt: 238.03, state: "固態" },
        { num: 118, sym: "Og", cn: "鿫", wt: 294, state: "氣態/未知" }
    ];

    // 線上 API 狀態中文翻譯對照
    const stateTranslation = {
        'gas': '氣態',
        'liquid': '液態',
        'solid': '固態',
        'synthetic': '人造元素'
    };

    const queryBtn = document.getElementById('queryBtn');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');
    const apiSearchBtn = document.getElementById('apiSearchBtn');
    const apiResultContainer = document.getElementById('apiResultContainer');

    // 功能一：輸入代號或中文，先找出目標，然後優先發送 fetch 向線上 API 查詢詳細數據
    queryBtn.addEventListener('click', () => {
        const inputVal = document.getElementById('searchQuery').value.trim().toLowerCase();
        
        if (!inputVal) {
            showStatus('⚠️ 請先輸入元素符號（如 Fe）或中文名稱（如 鐵）！', 'orange');
            return;
        }

        // 步驟 1: 先在本地對照表中識別該元素
        const matchedElement = elementDatabase.find(el => 
            el.sym.toLowerCase() === inputVal || 
            el.cn === inputVal ||
            el.cn.includes(inputVal)
        );

        if (!matchedElement) {
            clearForm();
            showStatus('❌ 找不到符合的元素代號或中文名稱，請重新輸入。', 'red');
            return;
        }

        queryBtn.disabled = true;
        showStatus('🔍 正在連線線上週期表 API...', 'gray');

        // 步驟 2: 呼叫免費開源的線上週期表資料庫 API (依據原子序)
        fetch(`https://neelpatel05.pythonanywhere.com/element/atomicnumber/${matchedElement.num}`)
        .then(res => {
            if (!res.ok) throw new Error('線上資料庫無回應');
            return res.json();
        })
        .then(apiData => {
            // 成功取得線上資料：進行渲染與欄位自動帶入
            document.getElementById('atomicNumber').value = apiData.atomicNumber;
            document.getElementById('name').value = `${matchedElement.cn} (${apiData.symbol})`;
            
            // 處理線上原子量 (部分元素帶有不確定度括號，予以保留)
            document.getElementById('atomicWeight').value = apiData.atomicMass;
            
            // 處理線上常溫常壓狀態 (英文轉中文翻譯)
            const rawState = apiData.standardState ? apiData.standardState.toLowerCase() : '';
            document.getElementById('state').value = stateTranslation[rawState] || matchedElement.state;

            submitBtn.disabled = false; // 開啟送出按鈕
            showStatus(`✨ 成功由線上 API 取得元素數據：${matchedElement.cn}！`, 'green');
        })
        .catch(err => {
            // 備援機制：API 連線失敗時，自動採用本地資料庫數據填入
            console.warn('線上 API 連線失敗，啟動本地備援機制：', err);
            
            document.getElementById('atomicNumber').value = matchedElement.num;
            document.getElementById('name').value = `${matchedElement.cn} (${matchedElement.sym})`;
            document.getElementById('atomicWeight').value = matchedElement.wt;
            document.getElementById('state').value = matchedElement.state;
            
            submitBtn.disabled = false;
            showStatus(`⚠️ 線上 API 離線，已自動啟動本地備援資料填入！`, 'orange');
        })
        .finally(() => {
            queryBtn.disabled = false;
        });
    });

    // 功能二：送出表單至 GAS (POST 請求)
    document.getElementById('elementForm').addEventListener('submit', (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        showStatus('⏳ 正在連線寫入試算表...', 'gray');

        // 包裝傳輸資料
        const payload = {
            atomicNumber: document.getElementById('atomicNumber').value,
            name: document.getElementById('name').value,
            atomicWeight: document.getElementById('atomicWeight').value,
            state: document.getElementById('state').value
        };

        // 發送 POST 請求至 GAS Web App 網址
        fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (!res.ok) throw new Error('伺服器無回應');
            return res.json();
        })
        .then(data => {
            if (data.status === 'success') {
                showStatus('🎉 成功！資料已順利寫入 Google 試算表！', 'green');
                clearForm();
                document.getElementById('searchQuery').value = '';
            } else {
                throw new Error(data.message || '寫入失敗');
            }
        })
        .catch(err => {
            console.error('API Error:', err);
            showStatus('❌ 寫入失敗，請確認您的 GAS 部署權限是否設為「所有人 (Anyone)」。', 'red');
            submitBtn.disabled = false;
        });
    });

    // 功能三：呼召 GAS GET API 線上查詢試算表資料
    apiSearchBtn.addEventListener('click', () => {
        const queryVal = document.getElementById('apiSearchQuery').value.trim();
        
        apiResultContainer.style.display = 'block';
        apiResultContainer.innerHTML = '🔍 正在從試算表即時讀取資料...';
        apiSearchBtn.disabled = true;

        // 組合網址，若有查詢關鍵字則帶上參數 ?q=
        const fetchUrl = queryVal ? `${GAS_URL}?q=${encodeURIComponent(queryVal)}` : GAS_URL;

        fetch(fetchUrl)
        .then(res => {
            if (!res.ok) throw new Error('連線失敗');
            return res.json();
        })
        .then(data => {
            if (data.status === 'error') throw new Error(data.message);
            
            if (data.length === 0) {
                apiResultContainer.innerHTML = '📭 試算表中沒有符合的建檔資料。';
                return;
            }

            // 渲染資料清單
            apiResultContainer.innerHTML = '';
            data.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';
                itemDiv.innerHTML = `<strong>${item.name}</strong> (原子序: ${item.atomicNumber}) | 原子量: ${item.atomicWeight} | 狀態: ${item.state}`;
                apiResultContainer.appendChild(itemDiv);
            });
        })
        .catch(err => {
            console.error('GET API Error:', err);
            apiResultContainer.innerHTML = '<span style="color: #dc2626;">❌ 無法獲取試算表資料，請確認 GAS 是否重新部署並設為「新版本」。</span>';
        })
        .finally(() => {
            apiSearchBtn.disabled = false;
        });
    });

    function showStatus(text, color) {
        statusMsg.innerText = text;
        if (color === 'green') statusMsg.style.color = '#059669';
        else if (color === 'red') statusMsg.style.color = '#dc2626';
        else if (color === 'orange') statusMsg.style.color = '#d97706';
        else statusMsg.style.color = '#4b5563';
    }

    function clearForm() {
        document.getElementById('atomicNumber').value = '';
        document.getElementById('name').value = '';
        document.getElementById('atomicWeight').value = '';
        document.getElementById('state').value = '';
        submitBtn.disabled = true;
    }
</script>

</body>
</html>
