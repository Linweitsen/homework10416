<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素資料建檔與查詢工具</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; }
        div { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 5px; box-sizing: border-box; }
        button { padding: 8px 15px; cursor: pointer; margin-top: 5px; }
        hr { margin: 30px 0; border: 0; border-top: 1px solid #ccc; }
        .result-box { background: #f9f9f9; padding: 10px; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>新增元素資料</h2>
    <form id="elementForm">
        <button type="submit" id="submitBtn">送出寫入試算表</button>
    </form>

    <hr>

    <h2>查詢元素</h2>
    <div>
        <input type="text" id="searchInput" placeholder="輸入元素名稱或原子序 (留空則查詢全部)">
        <button type="button" id="searchBtn">使用 API 查詢</button>
    </div>
    <div id="searchResult" class="result-box">查詢結果會顯示在這裡...</div>

    <script>
        // 替換為你的 GAS Web App URL
        const GAS_URL = '請貼上_你的_GAS_Web_App_URL';

        // --- 寫入功能 (POST) 保持原樣 ---
        document.getElementById('elementForm').addEventListener('submit', function(e) {
            // ... (保留你原本的 POST 程式碼) ...
        });

        // --- 查詢功能 (GET) 新增 ---
        document.getElementById('searchBtn').addEventListener('click', function() {
            const queryWord = document.getElementById('searchInput').value.trim();
            const resultBox = document.getElementById('searchResult');
            const btn = document.getElementById('searchBtn');
            
            btn.disabled = true;
            resultBox.innerText = "正在透過 API 查詢中...";

            // 組合 API 網址，將關鍵字附加在 URL 後方作為參數
            const apiUrl = queryWord ? `${GAS_URL}?query=${encodeURIComponent(queryWord)}` : GAS_URL;

            // 原生 fetch GET 請求 (不寫 method 預設就是 GET)
            fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    resultBox.innerText = "找不到符合的元素資料。";
                    return;
                }
                
                // 清空並組合結果
                resultBox.innerHTML = ""; 
                data.forEach(item => {
                    resultBox.innerHTML += `<p><strong>${item.name}</strong><br>
                                            原子序: ${item.atomicNumber} | 
                                            原子量: ${item.atomicWeight} | 
                                            狀態: ${item.state}</p>`;
                });
            })
            .catch(error => {
                console.error('API 錯誤:', error);
                resultBox.innerText = "查詢失敗，請檢查網頁 Console。";
            })
            .finally(() => {
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
